server {
    listen 80;
    listen [::]:80;
    server_name ali33.sunstudy.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ali33-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ali33.sunstudy.app;
    ssl_certificate /etc/letsencrypt/live/ali33.sunstudy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ali33.sunstudy.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
