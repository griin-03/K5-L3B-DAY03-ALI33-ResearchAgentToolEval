server {
    listen 80;
    listen [::]:80;
    server_name ali33.sunstudy.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ali33-acme;
        default_type text/plain;
    }
    location / {
        return 503 "ALI33 deployment in progress.\n";
        add_header Content-Type text/plain;
    }
}
